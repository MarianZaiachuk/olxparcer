# ==============================================================================
# OLX DEAL SNIPER CONFIGURATION
# ==============================================================================

telegram:
  # Токен бота, отриманий від @BotFather
  bot_token: "" # Можна також задати через змінну оточення TELEGRAM_BOT_TOKEN
  # Ваш числовий Chat ID або ID каналу/групи
  chat_id: ""   # Можна також задати через змінну оточення TELEGRAM_CHAT_ID

monitoring:
  # Базовий інтервал опитування (в секундах)
  check_interval_seconds: 45
  # Джиттер (випадкове відхилення +/- секунд) для захисту від блокувань за патернами
  jitter_seconds: 15
  # Кількість останніх оголошень для аналізу за один запит
  offers_limit: 30
  # Чи сповіщати про оголошення при найпершому холодному старті бота
  # false = просто зберегти в базу наявні оголошення як початкову точку відліку
  # true = відправити сповіщення про все, що знайдено зараз
  notify_on_startup: false

regions:
  # Пріоритетний регіон: 13 = Івано-Франківська область
  priority_region_id: 13
  priority_region_name: "Івано-Франківськ"
  priority_cities:
    - "івано-франківськ"
    - "калуш"
    - "коломия"
    - "надвірна"
    - "яремче"
    - "долина"
    - "бурштин"
    - "богородчани"

database:
  path: "data/seen_ads.db"

# Глобальний чорний список стоп-слів (діє на всі цільові пошуки)
global_stop_words:
  # Неробоча техніка / дефекти
  - "на запчастини"
  - "на запчасти"
  - "під відновлення"
  - "под восстановление"
  - "під ремонт"
  - "под ремонт"
  - "не працює"
  - "не робочий"
  - "не включається"
  - "не включается"
  - "дефект"
  - "битий"
  - "розбитий"
  - "битый"
  - "разбитый"
  - "тріщина"
  - "трещина"
  - "глючить"
  - "глючит"
  - "пляма на екрані"
  - "пятно"
  # Блокування / підробки
  - "icloud"
  - "айклауд"
  - "mdm"
  - "мдм"
  - "r-sim"
  - "rsim"
  - "рсім"
  - "lock"
  - "заблокований"
  - "заблокирован"
  - "пароль"
  - "activation lock"
  - "копія"
  - "копия"
  - "люкс копія"
  - "1:1"
  - "репліка"
  - "реплика"
  # Обмін та інші небажані пропозиції
  - "обмін"
  - "обмен"
  - "куплю"
  - "скупка"
  - "оренда"
  - "аренда"

# Список цільових моніторингів (пошукових запитів)
searches:
  # --------------------------------------------------------------------------
  # 1. ТЕХНІКА APPLE (ТОП МАРЖИНАЛЬНОСТІ ТА ЛІКВІДНОСТІ)
  # --------------------------------------------------------------------------
  - name: "Apple iPhone (13 / 14 / 15 / 16 серії)"
    query: "iphone"
    min_price: 10000
    max_price: 45000
    # Можна вказати обов'язкові слова (якщо порожньо - підходить будь-який)
    whitelist: []
    stop_words:
      - "чохол"
      - "чехол"
      - "скло"
      - "стекло"
      - "коробка"
      - "кабель"

  - name: "Apple MacBook (M1 / M2 / M3 / M4)"
    query: "macbook"
    min_price: 15000
    max_price: 65000
    stop_words:
      - "чохол"
      - "чехол"
      - "наклейка"
      - "сумка"
      - "зарядка"
      - "magsafe"

  - name: "Apple iPad (Air / Pro / Mini)"
    query: "ipad"
    min_price: 8000
    max_price: 35000
    stop_words:
      - "стилус"
      - "pencil"
      - "чохол"

  - name: "Apple AirPods (Pro 2 / Max)"
    query: "airpods"
    min_price: 4000
    max_price: 18000
    stop_words:
      - "один навушник"
      - "кейс"
      - "лівий"
      - "правий"

  - name: "Apple Watch (Series 8 / 9 / 10 / Ultra)"
    query: "apple watch"
    min_price: 6000
    max_price: 25000
    stop_words:
      - "ремінець"
      - "ремешок"

  # --------------------------------------------------------------------------
  # 2. РЕКОМЕНДОВАНІ ВИСОКОМАРЖИНАЛЬНІ НІШІ ДЛЯ ПЕРЕПРОДАЖУ
  # --------------------------------------------------------------------------
  - name: "Ігрові консолі: PlayStation 5 / PS4 Pro"
    query: "playstation 5"
    min_price: 10000
    max_price: 20000
    stop_words:
      - "диск"
      - "геймпад"
      - "джойстик"
      - "підставка"

  - name: "Портативні консолі: Steam Deck / Nintendo Switch OLED"
    query: "steam deck"
    min_price: 10000
    max_price: 22000
    stop_words:
      - "чохол"
      - "док станція"

  - name: "Зарядні станції: EcoFlow / Bluetti"
    query: "ecoflow"
    min_price: 8000
    max_price: 30000
    stop_words:
      - "кабель"
      - "сумка"
      - "сонячна панель"
