[project]
name = "olxparcer"
version = "0.1.0"
description = "OLX.ua deal monitor with market valuation, price-drop tracking, and Telegram alerts"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "aiogram>=3.31.0",
    "curl-cffi>=0.17.0",
    "pydantic>=2.13.5",
    "python-dotenv>=1.2.4",
    "pyyaml>=6.0.3",
]

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "pytest-asyncio>=1.4.1.post1",
    "ruff>=0.17.4",
]

[tool.pytest.ini_options]
asyncio_default_fixture_loop_scope = "function"
